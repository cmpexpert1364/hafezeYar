name: Build HafezeYar APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.html'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          HTML_FILE=""

          for f in hafezeyar_v30_integrated_release_candidate.html hafezeyar_v30_integrated_release_candidate.htm; do
            if [ -f "$f" ]; then
              HTML_FILE="$f"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE="$(find . -maxdepth 1 -type f -name '*.html' ! -name 'index.html' | sort | head -n 1)"
          fi

          if [ -z "$HTML_FILE" ]; then
            HTML_FILE="$(find . -maxdepth 1 -type f -name 'index.html' | head -n 1)"
          fi

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: No HTML file found in repository root."
            exit 1
          fi

          echo "Using HTML file: $HTML_FILE"

          mkdir -p app/src/main/assets
          cp "$HTML_FILE" app/src/main/assets/index.html

          mkdir -p app/src/main/java/com/cmpexpert/hafezeyar

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HafezeYar"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.cmpexpert.hafezeyar'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.cmpexpert.hafezeyar'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="حافظه‌یار"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/cmpexpert/hafezeyar/MainActivity.java <<'EOF'
          package com.cmpexpert.hafezeyar;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());

                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          gradle --version
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HafezeYar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
